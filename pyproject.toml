[project]
name = "fhirclient"
requires-python = ">= 3.9"
dependencies = [
    "requests >= 2.4",
]
authors = [{ name="SMART Platforms Team", email="support@smarthealthit.org" }]
readme = "README.md"
keywords = ["smart", "fhir", "healthcare", "medical-informatics", "clinical-informatics", "biomedical-informatics"]
license = { file="LICENSE" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["description", "version"]

[project.urls]
Homepage = "https://github.com/smart-on-fhir/client-py"
Documentation = "https://docs.smarthealthit.org/client-py/"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
testpaths = "tests"

[project.optional-dependencies]
tests = [
    "pytest >= 2.5",
    "pytest-cov",
    "responses",
]

dev = [
    "ruff",
]

[tool.ruff]
line-length = 88
# select is now under [tool.ruff.lint]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "fhirclient/models/*", # Exclude generated models
    "fhir-parser/*",       # Exclude fhir-parser submodule
    "fhir-parser-resources/*", # Exclude parser resources/templates
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

# Allow unused variables in __init__.py files (often used for imports)
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
